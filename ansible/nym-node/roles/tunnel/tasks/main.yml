---
- name: Ensure nym binaries directory exists
  file:
    path: /root/nym-binaries
    state: directory
    mode: "0755"
  tags:
    - tunnel
    - network_tunnel_manager
    - ntm

- name: Verify tunnel_manager_sha256 is defined
  fail:
    msg: "SECURITY: tunnel_manager_sha256 must be set in group_vars/all.yml before downloading and executing network-tunnel-manager.sh as root. Generate with: curl -fsSL {{ tunnel_manager_url }} | sha256sum"
  when: tunnel_manager_sha256 is not defined or tunnel_manager_sha256 == ""
  tags:
    - tunnel
    - network_tunnel_manager
    - ntm

- name: Download network tunnel manager
  command:
    cmd: "curl -fsSL {{ tunnel_manager_url }} -o /root/nym-binaries/network-tunnel-manager.sh"
  tags:
    - tunnel
    - network_tunnel_manager
    - ntm

- name: Verify network tunnel manager checksum
  shell: |
    ACTUAL_SHA256=$(sha256sum /root/nym-binaries/network-tunnel-manager.sh | awk '{print $1}')
    if [ "$ACTUAL_SHA256" != "{{ tunnel_manager_sha256 }}" ]; then
      echo "SECURITY ERROR: Checksum mismatch for network-tunnel-manager.sh"
      echo "Expected: {{ tunnel_manager_sha256 }}"
      echo "Actual:   $ACTUAL_SHA256"
      exit 1
    fi
  tags:
    - tunnel
    - network_tunnel_manager
    - ntm

- name: Set network tunnel manager permissions
  file:
    path: /root/nym-binaries/network-tunnel-manager.sh
    mode: "0755"
  tags:
    - tunnel
    - network_tunnel_manager
    - ntm
    
- name: Run network tunnel manager
  command: "/root/nym-binaries/network-tunnel-manager.sh {{ item }}"
  loop:
    - complete_networking_configuration
  tags:
    - tunnel
    - network_tunnel_manager
    - ntm
