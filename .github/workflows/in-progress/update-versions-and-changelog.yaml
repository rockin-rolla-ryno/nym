name: update-versions-and-changelog

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, usually the milestone title"
        required: true
        type: string
      milestone_id:
        description: "Milestone ID, check the URL when you're on the specific milestone page"
        required: true
        type: string

env:
  CI_BOT_AUTHOR: "Nym bot"
  CI_BOT_EMAIL: "nym-bot@users.noreply.github.com"

jobs:
  update-versions:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout-source
        uses: actions/checkout@v3
        with:
          ref: "release/${{ inputs.release_version }}"
          path: "nym"

      - name: checkout-ci-tools-repo
        uses: actions/checkout@v3
        with: 
          repository: "nymtech/ci-tools"
          ref: "master"
          path: "ci-tools"
          token: "${{ secrets.ACCESS_TOKEN_PRIVATE_REPOS }}"

      - name: Install Rust stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: install-version-bumper
        run: "cargo install --path ."
        working-directory: "ci-tools/version-bumper"

      - name: run-version-bumper
        run: "version-bumper bump binaries --nym-repo-directory nym"

      - name: push-changes-to-branch
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          # Validate release_version contains only safe characters (alphanumeric, dash, underscore, dot)
          if ! [[ "$RELEASE_VERSION" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "Error: release_version must contain only alphanumeric characters, dashes, underscores, and dots, got: '$RELEASE_VERSION'"
            exit 1
          fi

          git config --global user.name "${{ env.CI_BOT_AUTHOR }}"
          git config --global user.email "${{ env.CI_BOT_EMAIL }}"
          git checkout -b "release/${RELEASE_VERSION}-preparation"
          git commit -am "chore: version bump in preparation for release"
          git push -u origin "release/${RELEASE_VERSION}-preparation"
        working-directory: "nym"

  update-changelog:
    runs-on: ubuntu-22.04
    needs: [update-versions]
    steps:
      - name: checkout-source
        uses: actions/checkout@v3
        with:
          ref: "release/${{ inputs.release_version }}"
          path: "nym"

      - name: checkout-ci-tools-repo
        uses: actions/checkout@v3
        with: 
          repository: "nymtech/ci-tools"
          ref: "master"
          path: "ci-tools"
          token: "${{ secrets.ACCESS_TOKEN_PRIVATE_REPOS }}"

      - name: Install Rust stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: install-changelog-updater
        run: "cargo install --path ."
        working-directory: "ci-tools/changelog-updater"

      - name: run-changelog-updater
        env:
          MILESTONE_ID: ${{ inputs.milestone_id }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          # Validate milestone_id is numeric
          if ! [[ "$MILESTONE_ID" =~ ^[0-9]+$ ]]; then
            echo "Error: milestone_id must be numeric, got: '$MILESTONE_ID'"
            exit 1
          fi

          # Validate release_version contains only safe characters (alphanumeric, dash, underscore, dot)
          if ! [[ "$RELEASE_VERSION" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "Error: release_version must contain only alphanumeric characters, dashes, underscores, and dots, got: '$RELEASE_VERSION'"
            exit 1
          fi

          changelog-updater mix "$MILESTONE_ID" "release/$RELEASE_VERSION"

      - name: push-changes-to-branch
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          # Validate release_version contains only safe characters (alphanumeric, dash, underscore, dot)
          if ! [[ "$RELEASE_VERSION" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "Error: release_version must contain only alphanumeric characters, dashes, underscores, and dots, got: '$RELEASE_VERSION'"
            exit 1
          fi

          git config --global user.name "${{ env.CI_BOT_AUTHOR }}"
          git config --global user.email "${{ env.CI_BOT_EMAIL }}"
          git checkout "release/${RELEASE_VERSION}-preparation"
          git commit -am "chore: update changelog preparation for release"
          git push
        working-directory: "nym"
