name: ci-build-upload-binaries

on:
  workflow_dispatch:
    inputs:
      feature_profile:
        description: "Select a predefined cargo feature profile"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - tokio-console
          - otel
          - otel,tokio-console
      extra_features:
        description: "Additional comma-separated cargo features (e.g. feat1,feat2)"
        required: false
        default: ""
        type: string
      add_tokio_unstable:
        description: 'Force RUSTFLAGS="--cfg tokio_unstable" (auto-set when tokio-console is selected)'
        required: false
        default: false
        type: boolean
      enable_deb:
        description: "Enable cargo-deb installation and .deb package building"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "14 0 * * *"

env:
  S3_ENDPOINT: https://s3.nymte.ch
  S3_BUCKET: builds

jobs:
  publish-nym:
    strategy:
      fail-fast: false
      matrix:
        platform: [arc-ubuntu-22.04]

    runs-on: ${{ matrix.platform }}
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_PERMIT_COPY_RENAME: 1
    steps:
      - name: Determine checkout ref
        id: checkout-ref
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # For manual dispatch, only allow protected refs (tags or default branch)
            REF="${{ github.ref }}"
            if [[ "$REF" == refs/tags/* ]] || [[ "$REF" == "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
              echo "ref=$REF" >> "$GITHUB_OUTPUT"
              echo "::notice::Checking out user-selected ref: $REF"
            else
              echo "::error::workflow_dispatch is only allowed from tags or the default branch for security reasons"
              exit 1
            fi
          else
            # For scheduled runs, use the default branch
            echo "ref=refs/heads/${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.checkout-ref.outputs.ref }}

      - name: Prepare build output directory
        shell: bash
        env:
          OUTPUT_DIR: ci-builds/${{ github.ref_name }}
        run: |
          rm -rf ci-builds || true
          mkdir -p "$OUTPUT_DIR"
          echo "$OUTPUT_DIR"

      - name: Install Dependencies (Linux)
        run: sudo apt-get update && sudo apt-get -y install libudev-dev

      - name: Validate and sanitize extra_features input
        if: github.event_name == 'workflow_dispatch'
        id: validate-input
        shell: bash
        env:
          EXTRA_FEATURES_INPUT: ${{ inputs.extra_features }}
        run: |
          # Validate extra_features contains only allowed characters: alphanumeric, comma, hyphen, underscore
          if [[ -n "$EXTRA_FEATURES_INPUT" ]]; then
            if [[ ! "$EXTRA_FEATURES_INPUT" =~ ^[a-zA-Z0-9,_-]+$ ]]; then
              echo "::error::extra_features input contains invalid characters. Only alphanumeric, comma, hyphen, and underscore are allowed."
              exit 1
            fi
            echo "sanitized_extra_features=$EXTRA_FEATURES_INPUT" >> "$GITHUB_OUTPUT"
            echo "::notice::Validated extra_features: $EXTRA_FEATURES_INPUT"
          else
            echo "sanitized_extra_features=" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve cargo features and RUSTFLAGS
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          PROFILE: ${{ inputs.feature_profile }}
          EXTRA: ${{ steps.validate-input.outputs.sanitized_extra_features }}
          ADD_TOKIO_UNSTABLE: ${{ inputs.add_tokio_unstable }}
        run: |
          FEATURES=""

          if [[ "$PROFILE" != "none" && -n "$PROFILE" ]]; then
            FEATURES="$PROFILE"
          fi

          if [[ -n "$EXTRA" ]]; then
            if [[ -n "$FEATURES" ]]; then
              FEATURES="${FEATURES},${EXTRA}"
            else
              FEATURES="$EXTRA"
            fi
          fi

          if [[ -n "$FEATURES" ]]; then
            echo "CARGO_FEATURES=--features ${FEATURES}" >> "$GITHUB_ENV"
            echo "::notice::Selected cargo features: $FEATURES"
          else
            echo "::notice::No additional cargo features selected"
          fi

          if [[ "$FEATURES" == *"tokio-console"* ]] || [[ "$ADD_TOKIO_UNSTABLE" == "true" ]]; then
            echo "RUSTFLAGS=--cfg tokio_unstable" >> "$GITHUB_ENV"
            echo "::notice::Enabled RUSTFLAGS --cfg tokio_unstable"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ vars.REQUIRED_RUSTC_VERSION }}

      - name: Build all binaries
        shell: bash
        run: cargo build --workspace --release ${{ env.CARGO_FEATURES }}

      - name: Install cargo-deb
        if: github.event_name == 'workflow_dispatch' && inputs.enable_deb == true
        shell: bash
        run: cargo install cargo-deb

      - name: Build deb packages
        if: github.event_name == 'workflow_dispatch' && inputs.enable_deb == true
        shell: bash
        run: make deb

      - name: Upload Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: nym-binaries-artifacts
          path: |
            target/release/nym-client
            target/release/nym-socks5-client
            target/release/nym-api
            target/release/nym-network-requester
            target/release/nym-cli
            target/release/nymvisor
            target/release/nym-node
          retention-days: 30

      - name: Prepare build output
        shell: bash
        env:
          OUTPUT_DIR: ci-builds/${{ github.ref_name }}
        run: |
          cp target/release/nym-client "$OUTPUT_DIR"
          cp target/release/nym-socks5-client "$OUTPUT_DIR"
          cp target/release/nym-api "$OUTPUT_DIR"
          cp target/release/nym-network-requester "$OUTPUT_DIR"
          cp target/release/nymvisor "$OUTPUT_DIR"
          cp target/release/nym-node "$OUTPUT_DIR"
          cp target/release/nym-cli "$OUTPUT_DIR"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.enable_deb }}" == "true" ]]; then
            cp target/debian/*.deb "$OUTPUT_DIR"
          fi

      - name: Publish builds to S3
        continue-on-error: true
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: garage
          SOURCE_PATH: ci-builds/
          DESTINATION: ""
          ENDPOINT: ${{ env.S3_ENDPOINT }}
          BUCKET: ${{ env.S3_BUCKET }}
        run: |
          # Ensure AWS CLI is available
          if ! command -v aws >/dev/null 2>&1; then
            echo "AWS CLI not found, installing..."
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            (sudo /tmp/aws/install --update || /tmp/aws/install --update --bin-dir "$HOME/.local/bin" --install-dir "$HOME/.local/aws-cli")
            export PATH="$HOME/.local/bin:$PATH"
          fi
          aws --version
          
          # Sync to S3
          export PATH="$HOME/.local/bin:$PATH"
          aws s3 sync "$SOURCE_PATH" "s3://$BUCKET/$DESTINATION" \
            --endpoint-url "$ENDPOINT" --no-progress
