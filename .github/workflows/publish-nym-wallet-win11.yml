name: publish-nym-wallet-win11
# Security Note: This workflow uses SSL.com's CodeSignTool for Windows code signing.
# The tool is pinned to a specific version and verified with a SHA256 checksum to prevent
# supply chain attacks. When updating CodeSignTool:
# 1. Update CODESIGNTOOL_VERSION in the "Download EV CodeSignTool" step
# 2. Download the new version manually and calculate its SHA256 checksum
# 3. Verify the checksum against SSL.com's official documentation or GitHub release
# 4. Update EXPECTED_CHECKSUM with the verified checksum
on:
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign this build using SSL.com. Signing is billed per signature so be careful"
        required: false
        type: boolean
        default: true
  release:
    types: [created]

defaults:
  run:
    working-directory: nym-wallet

jobs:
  publish-tauri:
    if: ${{ (startsWith(github.ref, 'refs/tags/nym-wallet-') && github.event_name == 'release') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [custom-windows-11]
    runs-on: ${{ matrix.platform }}

    outputs:
      release_tag: ${{ github.ref_name }}

    env:
      SIGN_WINDOWS: ${{ github.event_name == 'release' || inputs.sign }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ vars.REQUIRED_RUSTC_VERSION }}

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Strip Authenticode thumbprint (avoid signtool on runner)
        working-directory: nym-wallet/src-tauri
        if: ${{ env.SIGN_WINDOWS == 'true' || (github.event_name == 'workflow_dispatch' && !inputs.sign) }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v yq >/dev/null 2>&1; then
            echo "yq is required on this runner to edit tauri.conf.json"
            exit 1
          fi
          yq eval --inplace '
            del(.bundle.windows.certificateThumbprint) |
            del(.bundle.windows.digestAlgorithm) |
            del(.bundle.windows.timestampUrl)
          ' tauri.conf.json

      - name: Download EV CodeSignTool from ssl.com
        working-directory: nym-wallet/src-tauri
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        env:
          # Pin to a specific version to prevent supply chain attacks
          CODESIGNTOOL_VERSION: "v1.3.1"
          # Expected SHA256 checksum for version v1.3.1
          # This checksum should be verified against SSL.com's official documentation
          # and updated when upgrading to a new version
          # IMPORTANT: This is a placeholder checksum. Before using this workflow in production,
          # you MUST replace this with the actual verified SHA256 checksum of CodeSignTool v1.3.1.
          # See .github/workflows/CODESIGNTOOL_UPDATE.md for instructions.
          EXPECTED_CHECKSUM: "PLACEHOLDER_REPLACE_WITH_ACTUAL_SHA256_CHECKSUM_OF_CODESIGNTOOL_V1_3_1"
        run: |
          set -euo pipefail
          
          # Download from a versioned URL instead of following redirects
          # Note: SSL.com provides versioned releases at GitHub
          DOWNLOAD_URL="https://github.com/SSLcom/codesigntool/releases/download/${CODESIGNTOOL_VERSION}/CodeSignTool-${CODESIGNTOOL_VERSION}.zip"
          
          echo "Downloading CodeSignTool ${CODESIGNTOOL_VERSION}..."
          curl -L --fail --retry 3 --retry-delay 5 -o codesigntool.zip "${DOWNLOAD_URL}"
          
          # Verify the checksum before extraction
          echo "Verifying checksum..."
          ACTUAL_CHECKSUM=$(sha256sum codesigntool.zip | awk '{print $1}')
          
          if [ "${ACTUAL_CHECKSUM}" != "${EXPECTED_CHECKSUM}" ]; then
            echo "ERROR: Checksum verification failed!"
            echo "Expected: ${EXPECTED_CHECKSUM}"
            echo "Actual:   ${ACTUAL_CHECKSUM}"
            echo "The downloaded file may have been tampered with or the version may have changed."
            echo "Do not proceed with signing. Verify the checksum with SSL.com and update the workflow."
            exit 1
          fi
          
          echo "Checksum verified successfully."
          unzip -q codesigntool.zip
          
          # Verify the expected script exists after extraction
          if [ ! -f "CodeSignTool.sh" ]; then
            echo "ERROR: CodeSignTool.sh not found after extraction!"
            echo "The archive structure may have changed."
            exit 1
          fi
          
          echo "CodeSignTool ${CODESIGNTOOL_VERSION} downloaded and verified successfully."
      - name: Get EV certificate credential id
        working-directory: nym-wallet/src-tauri
        if: env.SIGN_WINDOWS == 'true'
        id: get_credential_ids
        shell: bash
        run: |
          echo "SSL_COM_CREDENTIAL_ID=$(./CodeSignTool.sh get_credential_ids -username=${{ secrets.SSL_COM_USERNAME }} -password=${{ secrets.SSL_COM_PASSWORD }} | sed -n '1!p' | sed 's/- //')" >> "$GITHUB_OUTPUT"
      - name: Add custom sign command to tauri.conf.json
        working-directory: nym-wallet/src-tauri
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        env:
          SSL_SIGN_USER: ${{ secrets.SSL_COM_USERNAME }}
          SSL_SIGN_PASS: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_SIGN_CRED: ${{ steps.get_credential_ids.outputs.SSL_COM_CREDENTIAL_ID }}
          SSL_SIGN_TOTP: ${{ secrets.SSL_COM_TOTP_SECRET }}
        run: |
          set -euo pipefail
          if ! command -v cygpath >/dev/null 2>&1; then
            echo "cygpath not found; install Git for Windows or use bash from Git SDK"
            exit 1
          fi
          export SCRIPT_UNIX="$(cygpath -u "$GITHUB_WORKSPACE/nym-wallet/src-tauri/CodeSignTool.sh")"
          yq eval --inplace '
            .bundle.windows += {
              "signCommand": {
                "cmd": "C:/Program Files/Git/bin/bash.exe",
                "args": [
                  strenv(SCRIPT_UNIX),
                  "sign",
                  ("-username " + strenv(SSL_SIGN_USER)),
                  ("-password " + strenv(SSL_SIGN_PASS)),
                  ("-credential_id " + strenv(SSL_SIGN_CRED)),
                  ("-totp_secret " + strenv(SSL_SIGN_TOTP)),
                  "-program_name NymWallet",
                  "-input_file_path",
                  "%1",
                  "-override"
                ]
              }
            }
          ' tauri.conf.json
      - name: Install project dependencies
        shell: bash
        run: cd .. && pnpm i

      - name: Install app dependencies
        shell: bash
        run: pnpm i

      - name: Build and sign it
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          SSL_COM_USERNAME: ${{ env.SIGN_WINDOWS == 'true' && secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ env.SIGN_WINDOWS == 'true' && secrets.SSL_COM_PASSWORD }}
          SSL_COM_CREDENTIAL_ID: ${{ env.SIGN_WINDOWS == 'true' && steps.get_credential_ids.outputs.SSL_COM_CREDENTIAL_ID }}
          SSL_COM_TOTP_SECRET: ${{ env.SIGN_WINDOWS == 'true' && secrets.SSL_COM_TOTP_SECRET }}
        run: |
          echo "Starting build process..."
          pnpm build

      - name: Check bundle directory
        shell: bash
        run: |
          echo "Checking bundle directory structure"
          
          # Check standard location
          if [ -d "target/release/bundle" ]; then
            echo "Found bundle directory at standard location"
            ls -la target/release/bundle || echo "Failed to list bundle directory"
          fi
          
          # Check src-tauri location
          if [ -d "src-tauri/target/release/bundle" ]; then
            echo "Found bundle directory in src-tauri"
            ls -la src-tauri/target/release/bundle || echo "Failed to list src-tauri bundle directory"
            
            # Use this path for future steps
            echo "BUNDLE_PATH=src-tauri/target/release/bundle" >> $GITHUB_ENV
          else
            echo "Using standard bundle path"
            echo "BUNDLE_PATH=target/release/bundle" >> $GITHUB_ENV
          fi
          
          # Check for MSI files in any location
          find . -name "*.msi" -type f

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: nym-wallet.msi
          path: |
            nym-wallet/${{ env.BUNDLE_PATH }}/msi/*.msi
            nym-wallet/${{ env.BUNDLE_PATH }}/*/nym-wallet*.msi
            nym-wallet/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

      - id: create-release
        name: Upload to release based on tag name
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'release'
        with:
          files: |
            nym-wallet/${{ env.BUNDLE_PATH }}/msi/*.msi
            nym-wallet/${{ env.BUNDLE_PATH }}/msi/*.msi.zip*
            nym-wallet/${{ env.BUNDLE_PATH }}/*/nym-wallet*.msi
            nym-wallet/src-tauri/target/release/bundle/msi/*.msi
          
      - name: Find MSI path for deployment
        id: find-msi
        shell: bash
        run: |
          MSI_FILE=$(find . -name "*.msi" -type f | head -n 1)
          if [ -n "$MSI_FILE" ]; then
            echo "Found MSI file: $MSI_FILE"
            echo "msi_path=$MSI_FILE" >> $GITHUB_OUTPUT
          else
            echo "WARNING: No MSI file found for deployment!"
            echo "msi_path=${{ env.BUNDLE_PATH }}/msi/nym-wallet*.msi" >> $GITHUB_OUTPUT
          fi

  push-release-data:
    if: ${{ (startsWith(github.ref, 'refs/tags/nym-wallet-') && github.event_name == 'release') || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/release-calculate-hash.yml
    needs: publish-tauri
    with:
      release_tag: ${{ needs.publish-tauri.outputs.release_tag || github.ref_name }}
    secrets: inherit
