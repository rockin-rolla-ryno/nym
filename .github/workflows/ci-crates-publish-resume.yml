# This is in case, for whatever reason, a publication run fails, and we need to restart halfway down the list, of unbumped/unpublished crates.
name: Resume crates.io publish

on:
  workflow_dispatch:
    inputs:
      resume_after:
        description: "Last successfully published crate (will start from the next one)"
        required: true
        type: string
      publish_interval:
        description: "Seconds to wait between publishes"
        required: false
        default: "600"
        type: string

jobs:
  publish:
    runs-on: arc-linux-latest
    env:
      RUSTUP_PERMIT_COPY_RENAME: 1
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install cargo-workspaces
        run: cargo install cargo-workspaces

      # Get crates in publish order, skip up to and including resume_after
      - name: Publish remaining crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RESUME_AFTER: ${{ inputs.resume_after }}
          PUBLISH_INTERVAL: ${{ inputs.publish_interval }}
        run: |
          # Validate publish_interval is a non-negative integer
          if ! [[ "$PUBLISH_INTERVAL" =~ ^[0-9]+$ ]]; then
            echo "Error: publish_interval must be a non-negative integer, got: '$PUBLISH_INTERVAL'"
            exit 1
          fi

          # Validate resume_after contains only safe characters (alphanumeric, dash, underscore)
          if ! [[ "$RESUME_AFTER" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "Error: resume_after must contain only alphanumeric characters, dashes, and underscores, got: '$RESUME_AFTER'"
            exit 1
          fi

          CRATES=$(cargo workspaces plan 2>/dev/null | sed -n '/^'"$RESUME_AFTER"'$/,$p' | tail -n +2)

          if [ -z "$CRATES" ]; then
            echo "Error: No crates found after '$RESUME_AFTER'"
            echo "Check the crate name matches exactly from 'cargo workspaces plan'"
            exit 1
          fi

          echo "Will publish the following crates:"
          echo "$CRATES"
          echo ""

          echo "$CRATES" | while read crate; do
            echo "Publishing $crate..."
            cargo publish -p "$crate" --allow-dirty
            echo "Waiting ${PUBLISH_INTERVAL}s before next publish..."
            sleep "$PUBLISH_INTERVAL"
          done

      - name: Show package versions
        run: cargo workspaces list --long
