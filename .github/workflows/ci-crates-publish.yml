name: Publish crates to crates.io

on:
  workflow_dispatch:
    inputs:
      publish_interval:
        description: "Seconds to wait between publishes (600 for first publish, 60 after)"
        required: false
        default: "600"
        type: string
      backup_author:
        description: "Second team member added as owner of the crate"
        required: false
        default: "jstuczyn"
        type: string

jobs:
  publish:
    runs-on: arc-linux-latest
    env:
      RUSTUP_PERMIT_COPY_RENAME: 1
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install cargo-workspaces
        run: cargo install cargo-workspaces

      - name: Preflight publish checks
        run: |
          python3 tools/internal/check_publish_preflight.py

      # --publish-as-is skips version bumping since that's done in a separate CI job.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo workspaces publish \
            --publish-as-is \
            --publish-interval ${{ inputs.publish_interval }}

      - name: Show package versions
        run: cargo workspaces list --long

      - name: Add team as crate owners
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          TEAM="github:nymtech:core"
          echo "Checking and adding $TEAM as owner to workspace crates..."

          cargo workspaces list | while read crate; do
            echo "Checking $crate..."

            if cargo owner --list "$crate" 2>/dev/null | grep -q "$TEAM"; then
              echo "  $TEAM already owns $crate, skipping"
            else
              echo "  Adding $TEAM as owner of $crate..."
              # TODO: proper fix needed. Some crates (e.g. nym-outfox) are owned only via a
              # team, and crates.io forbids team-derived owners from modifying the owner list
              # (403 "team members don't have permission to modify owners"). Tolerate that here
              # so one crate's ownership gap does not abort the whole publish; the missing owner
              # must then be added out of band by a named individual owner of that crate.
              cargo owner --add "$TEAM" "$crate" || echo "  WARN: could not add $TEAM to $crate (needs manual ownership sorting); continuing"
              sleep 2
            fi
          done

          echo "Done!"

      - name: Add secondary member as crate owner
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Allowlist of authorized crates.io identities that may be granted ownership.
          # This list must be maintained manually and should include only trusted team members.
          AUTHORIZED_OWNERS=(
            "github:nymtech:core"
            "jstuczyn"
          )
          
          REQUESTED_OWNER="${{ inputs.backup_author }}"
          
          # Validate that the requested owner is in the allowlist
          OWNER_AUTHORIZED=false
          for authorized in "${AUTHORIZED_OWNERS[@]}"; do
            if [ "$authorized" = "$REQUESTED_OWNER" ]; then
              OWNER_AUTHORIZED=true
              break
            fi
          done
          
          if [ "$OWNER_AUTHORIZED" != "true" ]; then
            echo "ERROR: Requested owner '$REQUESTED_OWNER' is not in the authorized owners list."
            echo "Authorized owners are: ${AUTHORIZED_OWNERS[*]}"
            echo "To add a new owner, update the AUTHORIZED_OWNERS allowlist in this workflow."
            exit 1
          fi
          
          echo "Checking and adding $REQUESTED_OWNER as owner to workspace crates..."

          cargo workspaces list | while read crate; do
            echo "Checking $crate..."

            # Use proper quoting to prevent shell injection
            if cargo owner --list "$crate" 2>/dev/null | grep -qF "$REQUESTED_OWNER"; then
              echo "  $REQUESTED_OWNER already owns $crate, skipping"
            else
              echo "  Adding $REQUESTED_OWNER as owner of $crate..."
              # See TODO in the "Add team as crate owners" step: tolerate the crates.io 403
              # for team-owned crates so a single ownership gap does not abort the publish.
              cargo owner --add "$REQUESTED_OWNER" "$crate" || echo "  WARN: could not add $REQUESTED_OWNER to $crate (needs manual ownership sorting); continuing"
              sleep 2
            fi
          done

          echo "Done!"
